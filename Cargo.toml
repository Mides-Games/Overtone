[workspace]
resolver = "2"
members = [
    "crates/overtone-core",
    "crates/overtone-audio",
    "crates/overtone-dsp",
    "crates/overtone-tempo",
    "crates/overtone-hitsound",
    "crates/overtone-bench",
    "crates/overtone-cli",
]

[workspace.package]
version = "4.0.0-dev"
edition = "2021"
license = "MIT"
repository = "https://github.com/githaltwastaken/Overtone"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Debug assertions were briefly left on for overtone-dsp in release, so that an
# indexing mistake in a kernel would panic rather than return a slightly wrong
# number. Measured, it cost more than it was worth on the hot paths; the same
# guarantee comes from `cargo test`, which runs in debug.

# Tests run in debug, so debug assertions and overflow checks stay on; only the
# optimisation level of the FFT dependencies and the DSP kernels is raised.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.overtone-dsp]
opt-level = 2
