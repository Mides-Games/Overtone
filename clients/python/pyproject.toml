[project]
name = "overtone-client"
version = "0.1.0"
description = "A standard-library client for the Overtone public API (personal tokens)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["overtone_client"]
