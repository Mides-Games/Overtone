openapi: 3.1.0
info:
  title: Overtone API
  version: 0.1.0
  description: |
    The Overtone website's API (site/api). Served under the web's own origin:
    the browser never calls it cross-origin, so there is no CORS.

    Sign-in is Mides SSO only. The browser holds one cookie,
    `__Host-overtone_session` (HttpOnly, SameSite=Lax, Secure, Path=/; plain
    `overtone_session` over http in development); Mides tokens never leave the
    server. Every state-changing request carries
    `X-Requested-With: overtone-web` or is refused with 403.

    Errors share one shape: `{ "error": { "status", "message", "code"? } }`.

    Not described here: `/api/internal/*`, the worker's side of the queue
    (claim, audio, progress, result, fail), which demands
    `Authorization: Bearer <WORKER_TOKEN>` and is documented in
    `site/api/src/routes/internal.routes.js`. When `PROXY_SECRET` is set
    (required in production) every other request must carry
    `X-Overtone-Proxy: <PROXY_SECRET>`, which only overtone-web adds;
    without it the answer is 404.
servers:
  - url: /api/v1

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-overtone_session
  parameters:
    sameOrigin:
      name: X-Requested-With
      in: header
      required: true
      schema: { type: string, const: overtone-web }
    analysisId:
      name: id
      in: path
      required: true
      description: 128 random bits in hex.
      schema: { type: string, pattern: '^[0-9a-f]{32}$' }
  schemas:
    QueueEntry:
      type: object
      required: [mine, status, private, song, uploader, anonymous, cached, createdAt, elapsedS]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$", description: Only on the caller's own rows. }
        ref: { type: string, pattern: "^[0-9a-f]{32}$", description: "Staff only, on waiting and running rows: what /analyses/{id}/moderate takes. Opens nothing." }
        mine: { type: boolean }
        status: { type: string, enum: [queued, running, done, refused, failed] }
        position: { type: integer, minimum: 1 }
        progress: { type: number, minimum: 0, maximum: 1 }
        stage: { type: [string, "null"] }
        private: { type: boolean }
        song: { type: [string, "null"], description: "Artist - Title from the tags, or the cleaned file name; null when private." }
        uploader:
          type: [object, "null"]
          properties:
            username: { type: string }
            displayName: { type: [string, "null"] }
            avatarUrl: { type: [string, "null"] }
        anonymous: { type: [boolean, "null"], description: null when private. }
        cached: { type: boolean }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        elapsedS: { type: integer, description: Seconds from upload to finish, or to now. }
    Queue:
      type: object
      required: [live, more, recent, at]
      properties:
        live: { type: array, items: { $ref: '#/components/schemas/QueueEntry' } }
        more: { type: integer, minimum: 0 }
        recent: { type: array, items: { $ref: '#/components/schemas/QueueEntry' } }
        at: { type: string, format: date-time }
        staff: { const: true, description: Present when the caller is a Mides moderator. }
    AnalysisCreated:
      type: object
      required: [id, status, cached]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{32}$' }
        status: { type: string, enum: [queued, done, refused] }
        cached: { type: boolean }
    Analysis:
      type: object
      required: [id, status, createdAt, cached]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, done, refused, failed] }
        filename: { type: [string, 'null'] }
        sha1:
          type: [string, 'null']
          description: >-
            The audio's SHA-1. The result page compares it with the file picked
            again in the browser before it plays it; the audio itself is never kept or served.
        createdAt: { type: string, format: date-time }
        cached: { type: boolean, description: Answered from an earlier analysis of the same audio and engine. }
        position: { type: integer, minimum: 1, description: While queued; 1 is next. }
        progress: { type: number, minimum: 0, maximum: 1, description: While running. }
        stage:
          type: [string, 'null']
          description: While running.
          enum: [load, attacks, coherence, fallback, tracker, octave, sections, vote, result, null]
        result: { $ref: '#/components/schemas/TimingResult' }
        error: { type: string, description: When failed. }
    TimingResult:
      type: object
      description: |
        `timing-result v1.1`, written by worker/timing_result.py. A refusal
        (`refused: true`) has no BPM and no red lines, and says why.
        `version` stays 1, so a v1 reader reads a v1.1 result unchanged; `minor`
        1 adds the read-only evidence the result page draws (`beats`,
        `downbeats_ms`, `onsets`, `onset_envelope`, the drift fields of
        `sections`, `swing`, `pulse_hints`). A v1.0 result, stored before, has
        none of them, and a refusal has none either.
      required: [format, version, engine, engine_hash, refused, red_lines, sections, osu_timing]
      properties:
        format: { const: timing-result }
        version: { const: 1 }
        minor: { type: integer, description: 1 for v1.1; absent on v1.0 results. }
        engine: { type: string, const: v3 }
        engine_mode: { type: [string, 'null'], enum: [precision, legacy, null] }
        engine_hash: { type: string }
        app_version: { type: string }
        beat_vote: { type: boolean }
        params: { type: object }
        duration_s: { type: [number, 'null'] }
        refused: { type: boolean }
        refusal:
          type: [object, 'null']
          properties:
            code: { type: string, enum: [no_pulse, too_short, too_long, refused] }
            message: { type: string }
        global_bpm: { type: [number, 'null'] }
        offset_ms: { type: [number, 'null'] }
        meter: { type: [string, 'null'] }
        stability: { type: [number, 'null'] }
        residual_ms: { type: [number, 'null'] }
        red_lines:
          type: array
          items:
            type: object
            properties:
              time_ms: { type: number }
              bpm: { type: number }
              beat_length_ms: { type: number }
              meter: { type: integer }
              meter_known: { type: boolean }
        sections:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              start_ms: { type: number }
              end_ms: { type: number }
              bpm: { type: number }
              confidence: { type: number }
              level: { type: string, enum: [high, medium, check] }
              residual_ms: { type: [number, 'null'] }
              coverage: { type: [number, 'null'] }
              drift_ms:
                type: [number, 'null']
                description: v1.1. Weighted median distance, ms, of the attacks under this line from its nearest 1/1, 1/2, 1/3 or 1/4 tick; null under 4 attacks.
              drift_p90_ms: { type: [number, 'null'], description: v1.1. Its 90th percentile. }
              drift_bias_ms: { type: [number, 'null'], description: 'v1.1. Weighted median signed distance: positive, the music lands after the grid.' }
              onsets: { type: integer, description: v1.1. Attacks under this line. }
        findings: { type: array, items: { type: object } }
        osu_timing: { type: string, description: "The engine's own [TimingPoints] rows." }
        beats:
          type: object
          description: v1.1. The engine's beats (whole ms) and its local tempo at each, the tempo curve.
          properties:
            t_ms: { type: array, items: { type: integer } }
            bpm: { type: array, items: { type: number } }
        downbeats_ms:
          type: array
          items: { type: integer }
          description: v1.1. The bar starts the click track plays (click_schedule), whole ms.
        onsets:
          type: object
          description: v1.1. The attacks the grid was fitted to, whole ms, weights 0-100 of the strongest. Empty for the fallback tracker.
          properties:
            t_ms: { type: array, items: { type: integer } }
            w: { type: array, items: { type: integer } }
        onset_envelope:
          type: object
          description: v1.1. The onset envelope, max-pooled to at most 4000 values of 0-100 over span_ms.
          properties:
            span_ms: { type: integer }
            v: { type: array, items: { type: integer } }
        swing:
          type: [object, 'null']
          description: v1.1. The engine's swing lane (swing_lane), its swung spans only.
          properties:
            measured: { type: integer }
            swung: { type: integer }
            spans: { type: array, items: { type: object } }
        pulse_hints:
          type: array
          description: v1.1. Half- or double-time regions inside one section (density_hints). Evidence, never a red line.
          items: { type: object }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, message]
          properties:
            status: { type: integer }
            message: { type: string }
            code:
              type: string
              description: Stable name to branch on; the message may change wording.
              examples: [SIGN_IN_REQUIRED, SSO_STATE_MISSING, NOT_IMPLEMENTED, RATE_LIMITED]
    Account:
      type: object
      description: Public profile fields cached from Mides. Never email or phone.
      required: [id, midesUserId, username, createdAt]
      properties:
        id: { type: string, format: uuid }
        midesUserId: { type: string }
        username: { type: string }
        displayName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'], format: uri }
        bannerUrl: { type: [string, 'null'], format: uri }
        role: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /health:
    get:
      summary: Liveness, database state and the upload limits
      responses:
        '200':
          description: Up. `database` is `none` when running without one (development only).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  database: { type: string, enum: [ok, down, none] }
                  devLogin: { type: boolean }
                  limits:
                    type: object
                    properties:
                      anonDailyLimit: { type: integer }
                      userDailyLimit: { type: integer }
                      maxAudioSeconds: { type: integer }
                      maxUploadMb: { type: integer }
        '503':
          description: The database does not answer (`status` is `degraded`).

  /auth/config:
    get:
      summary: What the login screen can offer
      responses:
        '200':
          description: Providers are empty when the SSO is not configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devLogin: { type: boolean }
                  providers:
                    type: array
                    items: { type: string, enum: [discord, google] }

  /auth/sso/start:
    get:
      summary: Where to send the browser to sign in
      description: |
        Builds `${MIDES_WEB_URL}/authorize?app=overtone&redirect_uri=${SITE_URL}/login/callback&provider=…`
        server side and sets the short-lived signed `overtone_sso` cookie
        (path /api/v1/auth) that the exchange demands. With MIDES_DEV_LOGIN the
        URL is `${SITE_URL}/login/callback#code=dev.<provider>.<nonce>` instead.
      parameters:
        - name: provider
          in: query
          schema: { type: string, enum: [discord, google] }
          description: Anything else is ignored and Mides shows its own choice.
      responses:
        '200':
          description: The URL to navigate to.
          headers:
            Set-Cookie: { schema: { type: string }, description: overtone_sso }
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '503': { $ref: '#/components/responses/Error' }

  /auth/sso/exchange:
    post:
      summary: Trade the code from /login/callback for a session
      description: |
        Posts the code to `${MIDES_AUTH_URL}/auth/sso/exchange`, caches the
        public profile, seals the refresh token (AES-256-GCM) and sets
        `overtone_session`. The `overtone_sso` cookie is spent whatever happens.
      parameters:
        - $ref: '#/components/parameters/sameOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 4096 }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { schema: { type: string }, description: overtone_session }
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
        '400':
          description: '`SSO_CODE_MISSING`, `SSO_CODE_INVALID`, or `SSO_STATE_MISSING` (the sign-in did not start in this browser).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      summary: Sign out everywhere
      description: Bumps the account's session version (every cookie of it stops working) and forgets the Mides token.
      parameters:
        - $ref: '#/components/parameters/sameOrigin'
      responses:
        '204':
          description: Signed out; the cookie is cleared.
        '403': { $ref: '#/components/responses/Error' }

  /me:
    get:
      summary: Who is signed in
      security:
        - session: []
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Error' }

  /analyses:
    post:
      summary: Upload a song for analysis
      description: |
        The body is the audio itself, streamed to the spool and hashed (SHA-1)
        on the way; it is deleted once the worker answers (ADR-W4). No account
        is needed: an anonymous uploader gets the HttpOnly `__Host-overtone_anon`
        cookie (Path=/; `overtone_anon` over http), which with the id is what lets it read
        the analysis back.

        Checked before a byte is read: the content type, the extension
        (mp3, ogg, wav, flac, m4a, opus), `Content-Length` against
        `MAX_UPLOAD_MB`, and the daily quota (`ANON_DAILY_LIMIT` per hashed
        address without an account, `USER_DAILY_LIMIT` with one; a cached
        answer is not counted). The size is checked again while the body
        streams. When the same audio was already analysed by the current
        engine, the answer is that result at once (200, `cached: true`).
      parameters:
        - $ref: '#/components/parameters/sameOrigin'
        - name: X-Filename
          in: header
          required: true
          description: The file's name, percent-encoded. Shown back to the uploader; never used as a path.
          schema: { type: string, maxLength: 1024 }
        - name: X-Private
          in: header
          required: false
          description: "`1` keeps the song, the file name and the uploader off the public queue (W3.8)."
          schema: { type: string, enum: ["1"] }
        - name: X-Title
          in: header
          required: false
          description: The title tag the browser read from the audio, percent-encoded; at most 200 characters are kept.
          schema: { type: string, maxLength: 1024 }
        - name: X-Artist
          in: header
          required: false
          description: The artist tag, as X-Title.
          schema: { type: string, maxLength: 1024 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Answered from an earlier analysis of the same audio and engine.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisCreated' }
        '202':
          description: Queued.
          headers:
            Set-Cookie: { schema: { type: string }, description: overtone_anon, without an account }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisCreated' }
        '400':
          description: '`UNSUPPORTED_FORMAT` or `EMPTY_UPLOAD`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413':
          description: '`TOO_LARGE`; `details.maxUploadMb` says the limit.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503':
          description: '`QUEUE_FULL`: `QUEUE_MAX` songs are already waiting or running.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            `QUOTA_EXCEEDED` (`details.limit`, `details.scope`: anonymous or
            account; resets at 00:00 UTC), `PENDING_LIMIT` (that many of this
            person's songs are already waiting or running: `ANON_MAX_PENDING` or
            `USER_MAX_PENDING`; same details) or `RATE_LIMITED` (with Retry-After).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /analyses/lookup:
    post:
      summary: Answer from the stored result without uploading
      description: |
        The audio's SHA-1, computed by the browser. When the current engine
        has analysed that audio, a new analysis is made from the stored
        result (as a cached upload would be) and returned; nothing counts
        against the quota or the queue. Otherwise `{ cached: false }`.
      parameters:
        - $ref: '#/components/parameters/sameOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha1, filename]
              properties:
                sha1: { type: string, pattern: '^[0-9a-f]{40}$' }
                filename: { type: string }
                size: { type: integer, minimum: 1 }
                private: { type: boolean }
                title: { type: [string, 'null'] }
                artist: { type: [string, 'null'] }
      responses:
        '200':
          description: "A hit (`AnalysisCreated` with `cached: true`) or `{ cached: false }`."
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/AnalysisCreated' }
                  - { type: object, required: [cached], properties: { cached: { const: false } } }
        '400':
          description: '`BAD_SHA1` or `UNSUPPORTED_FORMAT`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /analyses/queue:
    get:
      summary: The public queue
      description: |
        Every analysis waiting or running (running first, then queued in the
        order the worker takes them, at most 100; `more` counts the rest) and
        those finished in the last hour (at most 20). A private upload shows
        its status and timing only. `id` appears on the caller's own rows,
        recognised by the session or the anonymous cookie. Polled by the page;
        served from a one-second snapshot.
      responses:
        '200':
          description: The queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }

  /analyses/moderation:
    get:
      summary: Staff only, the latest moderations of the queue
      description: |
        The last 50 removals and requeues, newest first, each with the
        moderator's username at the time, the analysis's ref and the reason.
      responses:
        '200':
          description: The log.
          content:
            application/json:
              schema:
                type: object
                required: [log]
                properties:
                  log:
                    type: array
                    items:
                      type: object
                      required: [action, moderator, ref, at]
                      properties:
                        action: { type: string, enum: [remove, requeue] }
                        moderator: { type: string }
                        ref: { type: [string, 'null'] }
                        reason: { type: [string, 'null'] }
                        at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: '`STAFF_ONLY`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /analyses/{id}/moderate:
    parameters:
      - $ref: '#/components/parameters/analysisId'
    post:
      summary: Staff only, remove a job from the queue or hand a running one back
      description: |
        `remove` fails a waiting or running job with "Removed from the queue by
        a moderator." and deletes its audio; a worker already on it has its
        answer refused. `requeue` puts a running job (a stuck one) back in the
        queue while its audio is still spooled. Both are recorded in
        `moderation_log` with who did it.
      parameters:
        - $ref: '#/components/parameters/sameOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [remove, requeue] }
                reason: { type: string, maxLength: 500 }
      responses:
        '204': { description: Done and recorded. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: '`STAFF_ONLY`, or `CSRF_HEADER_MISSING`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: '`NOT_LIVE` (remove: it has finished), `NOT_RUNNING` (requeue: it is not running) or `AUDIO_GONE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /analyses/{id}:
    parameters:
      - $ref: '#/components/parameters/analysisId'
    get:
      summary: An analysis's state, and its result once there is one
      description: |
        Readable by the session account or the anonymous cookie that created
        it; anyone else gets the same 404 as for an id that does not exist.
        Poll it: `position` while queued (1 = next), `progress` and `stage`
        while running.
      responses:
        '200':
          description: The analysis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Analysis' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Cancel an analysis that is still waiting
      description: |
        Only by whoever may read it (the session account or the anonymous
        cookie that created it). The job, the row and the spooled audio are
        deleted, so the song does not count against the day's quota. A song
        the worker has already taken is not cancelled.
      parameters:
        - $ref: '#/components/parameters/sameOrigin'
      responses:
        '204': { description: Cancelled. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: '`NOT_QUEUED`: it is being analysed, or it has finished.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /analyses/{id}/timing.txt:
    parameters:
      - $ref: '#/components/parameters/analysisId'
    get:
      summary: The `[TimingPoints]` block, CRLF, as an .osu file holds it
      responses:
        '200':
          description: An attachment.
          content:
            text/plain: { schema: { type: string } }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: '`NO_TIMING`: still running, refused or failed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /analyses/{id}/timing.csv:
    parameters:
      - $ref: '#/components/parameters/analysisId'
    get:
      summary: 'The red lines as CSV: time_ms, bpm, beat_length_ms, meter, confidence, level'
      responses:
        '200':
          description: An attachment.
          content:
            text/csv: { schema: { type: string } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
