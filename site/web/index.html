<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Overtone: automatic timing for osu! maps, by Mides Projects." />
    <meta name="theme-color" content="#f5f4f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0b12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Link previews (W10.3). Crawlers read this file as served, before any
         script runs, so these name the site; each page's own title and
         description are set by usePageMeta once the app loads. The image URL
         has to be absolute, so it names production. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Overtone" />
    <meta property="og:title" content="Overtone · Mides Projects" />
    <meta property="og:description" content="Automatic timing for osu! maps: BPM, offset and red lines, with the confidence of each section." />
    <meta property="og:url" content="https://overtone.midesprojects.com/" />
    <meta property="og:image" content="https://overtone.midesprojects.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Mides Projects mark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Overtone · Mides Projects" />
    <meta name="twitter:description" content="Automatic timing for osu! maps: BPM, offset and red lines, with the confidence of each section." />
    <meta name="twitter:image" content="https://overtone.midesprojects.com/og-image.png" />
    <title>Overtone · Mides Projects</title>
    <script>
      // Theme, language and the settings page's choices before the first
      // frame, so a light-mode visitor never sees a dark flash and a larger
      // font never jumps. Same theme and language keys as midesprojects.com;
      // dark is the default there too. `system` follows the OS. The settings
      // are checked again by lib/settings.js once the app runs; this only
      // sets what a valid value asks for. serve.mjs allows this script by its
      // hash, computed from the built file, so editing it needs nothing else.
      try {
        var root = document.documentElement
        var theme = localStorage.getItem('mides.theme')
        if (theme === 'light' || (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) root.classList.remove('dark')
        var lang = localStorage.getItem('mides.lang')
        if (['en', 'es', 'fr', 'de', 'it', 'pl', 'pt-BR', 'ja', 'ko', 'ru'].indexOf(lang) >= 0) root.lang = lang
        var s = JSON.parse(localStorage.getItem('overtone.settings') || '{}') || {}
        if (s.contrast === 'more') root.classList.add('contrast-more')
        if (s.palette === 'cb') root.classList.add('palette-cb')
        if (s.reducedMotion === 'reduce' || s.reducedMotion === 'allow') root.classList.add('motion-' + s.reducedMotion)
        if (typeof s.fontScale === 'number' && s.fontScale >= 0.9 && s.fontScale <= 1.3) root.style.setProperty('--font-scale', String(s.fontScale))
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
