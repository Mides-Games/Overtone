<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Overtone: automatic timing for osu! maps, by Mides Projects." />
    <meta name="theme-color" content="#f5f4f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0b12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Overtone · Mides Projects</title>
    <script>
      // Theme and language before the first frame, so a light-mode visitor
      // never sees a dark flash. Same keys as midesprojects.com; dark is the
      // default there too.
      try {
        if (localStorage.getItem('mides.theme') === 'light') document.documentElement.classList.remove('dark')
        if (localStorage.getItem('mides.lang') === 'es') document.documentElement.lang = 'es'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
